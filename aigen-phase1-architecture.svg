<rect x="650" y="1545" width="620" height="110" fill="#fef2f2" stroke="#ef4444" stroke-width="2" rx="8"/>
<text x="660" y="1568" class="tx" style="font-weight:bold;fill:#b91c1c">What this diagram adds vs swimlane</text>
