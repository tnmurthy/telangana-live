<rect x="30" y="886" width="1240" height="285" fill="#faf5ff" stroke="#a855f7" stroke-width="3" rx="8"/>

<!-- Intent Parser box -->
<rect x="50" y="900" width="310" height="255" fill="#f3e8ff" stroke="#c084fc" stroke-width="2" rx="6"/>
<text x="205" y="924" class="bt">Step A — Intent Classifier</text>
<text x="205" y="942" class="bs">Codex few-shot prompt · deterministic</text>
<text x="205" y="966" class="tx">Reads: mode, source type, sink type, language</text>
<text x="205" y="984" class="tx">Classifies: streaming | batch | sql-only</text>
<text x="205" y="1002" class="tx">Selects runtime: Databricks / Synapse / ADF</text>
<text x="205" y="1020" class="tx">Selects adapter template: kafka/blob/cdc/api</text>
<text x="205" y="1038" class="tx">Confidence score emitted (threshold 0.85)</text>
<rect x="62" y="1055" width="286" height="30" fill="#1e1b4b" rx="4"/>
<text x="205" y="1066" class="tl">output: GenerationPlan object</text>
<text x="205" y="1079" class="tl">{mode, runtime, adapter, lang}</text>
<rect x="62" y="1120" width="286" height="18" fill="#0f172a" rx="4"/>
<text x="205" y="1132" class="tl">Prompt: 5-shot · temperature 0 · top_p 1</text>

<!-- Pass 1 box -->
<rect x="380" y="900" width="380" height="255" fill="#2e1065" stroke="#4c1d95" stroke-width="2" rx="6"/>
<text x="570" y="924" class="tl" style="font-weight:bold;font-size:14px">Step B — Rule Mapping (Codex Pass 1)</text>
<text x="570" y="942" class="tl">Reads lineage_text from PipelineSpec</text>
<text x="390" y="966" class="cd">"flatten items[]"</text>
<text x="400" y="985" class="cm">→ df.withColumn("item", explode(col("items")))</text>
<text x="390" y="1006" class="cd">"cast ts to UTC epoch"</text>
<text x="400" y="1025" class="cm">→ F.to_utc_timestamp(F.from_unixtime(col("ts")/1000))</text>
<text x="390" y="1046" class="cd">"filter CANCELLED"</text>
<text x="400" y="1065" class="cm">→ df.filter(col("status") != "CANCELLED")</text>
<text x="390" y="1086" class="cd">"join dim_customer on id"</text>
<text x="400" y="1105" class="cm">→ df.join(dim_cust, "customer_id", "left")</text>
<rect x="392" y="1120" width="356" height="18" fill="#0f172a" rx="4"/>
<text x="570" y="1132" class="tl">output: RuleList[ {op, field, expr, pyspark_code} ]</text>

<!-- Pass 2 box -->
<rect x="775" y="900" width="475" height="255" fill="#2e1065" stroke="#4c1d95" stroke-width="2" rx="6"/>
<text x="1012" y="924" class="tl" style="font-weight:bold;font-size:14px">Step C — Synthetic Validation (Codex Pass 2)</text>
<text x="1012" y="942" class="tl" text-anchor="middle">Generates mock data from src schema → runs code → asserts</text>
<text x="787" y="966" class="cd">src_schema = fetch_schema("order-v2")  # Apicurio</text>
<text x="787" y="984" class="cd">mock_rows = faker.generate(src_schema, n=200)</text>
<text x="787" y="1002" class="cd">spark_df = spark.createDataFrame(mock_rows)</text>
<text x="787" y="1020" class="cd">result = transform_fn(spark_df)  # generated code</text>
<text x="787" y="1038" class="cd">assert result.count() == 200  # no data loss</text>
<text x="787" y="1056" class="cd">assert result.schema == target_schema</text>
<text x="787" y="1074" class="cd">gx.validate(result, expectation_suite)</text>
<rect x="787" y="1120" width="451" height="18" fill="#0f172a" rx="4"/>
<text x="1012" y="1132" class="tl" text-anchor="middle">output: validation_report.json · PASS → proceed · FAIL → re-prompt</text>

