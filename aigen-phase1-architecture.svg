<!-- ===== ZONE 2: PARSERS ===== -->
<rect x="30" y="420" width="1240" height="26" fill="#0284c7" rx="4"/>
<text x="650" y="438" class="zh" text-anchor="middle">ZONE 2 — FORMAT PARSERS</text>

<!-- Metadata Parser -->
<rect x="30" y="458" width="595" height="140" fill="#f0f9ff" stroke="#38bdf8" stroke-width="2" rx="6"/>
<text x="327" y="482" class="bt">Metadata &amp; Schema Parser</text>
<text x="327" y="500" class="bs">Pydantic v2 · strict validation · typed config</text>
<text x="327" y="522" class="tx">JSON manifest → PipelineConfig (Pydantic BaseModel)</text>
<text x="327" y="542" class="tx">Schema Registry API → fetch Avro/JSON Schema by version</text>
<text x="327" y="562" class="tx">Validates: source reachable · schema exists · runtime valid</text>
<rect x="42" y="576" width="571" height="16" fill="#0f172a" rx="4"/>
<text x="327" y="588" class="tl">output → PipelineSpec.hints (typed dict) + src/tgt schemas</text>

<!-- Document Analyzer -->
<rect x="635" y="458" width="635" height="140" fill="#f0f9ff" stroke="#38bdf8" stroke-width="2" rx="6"/>
<text x="952" y="482" class="bt">Azure Document Analyzer (Form Recognizer)</text>
<text x="952" y="500" class="bs">prebuilt-layout model · multi-page · table-aware</text>
<text x="952" y="522" class="tx">PDF/Word/image → layout-aware markdown extraction</text>
<text x="952" y="542" class="tx">Tables → structured key-value pairs preserved</text>
<text x="952" y="562" class="tx">Checkboxes / headers / numbered lists detected</text>
<rect x="647" y="576" width="611" height="16" fill="#0f172a" rx="4"/>
<text x="952" y="588" class="tl">output → normalised LineageText (clean markdown, UTF-8)</text>

<!-- Arrow Z2→Z3 -->
<line x1="650" y1="598" x2="650" y2="638" stroke="#0284c7" stroke-width="2" marker-end="url(#ab)"/>

<!-- ===== ZONE 3: PIPELINESPEC ===== -->
<rect x="30" y="650" width="1240" height="26" fill="#0369a1" rx="4"/>
<text x="650" y="668" class="zh" text-anchor="middle">ZONE 3 — PIPELINESPEC OBJECT (unified internal state)</text>

<rect x="30" y="688" width="1240" height="110" fill="#f0f9ff" stroke="#38bdf8" stroke-width="2" rx="6"/>
<text x="650" y="710" class="bt">PipelineSpec: hints_dict + lineage_text merged → single immutable object</text>
<rect x="50" y="722" width="560" height="60" fill="#0f172a" rx="5"/>
<text x="70" y="744" class="cd">pipeline_id: "orders_v1"   mode: "streaming"</text>
<text x="70" y="762" class="cd">source: {type:kafka, topic:"orders.v2"}</text>
<text x="70" y="780" class="cd">sink: {type:synapse, table:"orders_clean"}</text>
<rect x="630" y="722" width="620" height="60" fill="#0f172a" rx="5"/>
<text x="650" y="744" class="cd">lineage_text: "flatten items[], cast ts field to UTC,</text>
<text x="650" y="762" class="cd">  filter CANCELLED rows, join dim_customer on id"</text>
<text x="650" y="780" class="cd">   ← raw markdown from Document Analyzer</text>

