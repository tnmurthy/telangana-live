<path d="M 160 355 L 160 410" fill="none" stroke="#0d9488" stroke-width="2" marker-end="url(#at)"/>
<path d="M 415 355 L 415 410" fill="none" stroke="#0d9488" stroke-width="2" marker-end="url(#at)"/>
<path d="M 670 355 L 670 410" fill="none" stroke="#0d9488" stroke-width="2" marker-end="url(#at)"/>
<path d="M 925 355 L 925 410" fill="none" stroke="#0d9488" stroke-width="2" marker-end="url(#at)"/>

<!-- Z2 ADAPTERS -->
<rect x="40" y="420" width="1320" height="24" fill="#0f766e" rx="4"/>
<text x="700" y="437" class="zh">ZONE 2 — FEDERATED ADAPTERS (Python Parser Models · Databricks/AKS/Functions)</text>

<rect x="40" y="456" width="280" height="155" fill="#f0fdfa" stroke="#0f766e" stroke-width="2" rx="6"/>
<text x="180" y="478" class="bt">Event Hubs Adapter</text>
<text x="180" y="496" class="bs">Avro deserialise · schema lookup</text>
<text x="180" y="514" class="bs">offset commit on success</text>
<text x="180" y="534" class="bs">consumer group isolation</text>
<rect x="52" y="548" width="256" height="18" fill="#115e59" rx="4"/><text x="180" y="561" class="tt">fastavro · schema_registry_client</text>
<rect x="52" y="572" width="256" height="26" fill="#115e59" rx="4"/><text x="180" y="581" class="tt">Document Analyzer: extract</text><text x="180" y="594" class="tt">structured fields from PDF docs</text>

<rect x="335" y="456" width="280" height="155" fill="#f0fdfa" stroke="#0f766e" stroke-width="2" rx="6"/>
<text x="475" y="478" class="bt">Blob File Adapter</text>
<text x="475" y="496" class="bs">Pydantic Parser Models</text>
<text x="475" y="514" class="bs">custom type inference per field</text>
<text x="475" y="534" class="bs">null-handling / coerce logic</text>
<rect x="347" y="548" width="256" height="18" fill="#115e59" rx="4"/><text x="475" y="561" class="tt">pandas · pydantic v2 · polars</text>
<rect x="347" y="572" width="256" height="26" fill="#115e59" rx="4"/><text x="475" y="581" class="tt">Document Analyzer: layout model</text><text x="475" y="594" class="tt">for Word/PDF lineage attachments</text>

<rect x="630" y="456" width="280" height="155" fill="#f0fdfa" stroke="#0f766e" stroke-width="2" rx="6"/>
<text x="770" y="478" class="bt">API Adapter</text>
<text x="770" y="496" class="bs">Pydantic Parsing Models</text>
<text x="770" y="514" class="bs">semantic flattening via jmespath</text>
<text x="770" y="534" class="bs">Pydantic validation layers</text>
<rect x="642" y="548" width="256" height="18" fill="#115e59" rx="4"/><text x="770" y="561" class="tt">pydantic · jmespath · httpx</text>
<rect x="642" y="572" width="256" height="26" fill="#115e59" rx="4"/><text x="770" y="581" class="tt">Codex: semantic field mapping</text><text x="770" y="594" class="tt">when API schema is ambiguous</text>

<rect x="925" y="456" width="280" height="155" fill="#f0fdfa" stroke="#0f766e" stroke-width="2" rx="6"/>
<text x="1065" y="478" class="bt">CDC Adapter</text>
<text x="1065" y="496" class="bs">before/after value extraction</text>
<text x="1065" y="514" class="bs">op-type normalise: I/U/D</text>
<text x="1065" y="534" class="bs">transaction_id preserved</text>
<rect x="937" y="548" width="256" height="18" fill="#115e59" rx="4"/><text x="1065" y="561" class="tt">Debezium · azure-servicebus SDK</text>

<!-- converge arrows to Z3 -->
<path d="M 180 611 L 180 660 L 700 660 L 700 700" fill="none" stroke="#1e3a8a" stroke-width="2" marker-end="url(#ab)"/>
<path d="M 475 611 L 475 660" fill="none" stroke="#1e3a8a" stroke-width="2"/>
<path d="M 770 611 L 770 660" fill="none" stroke="#1e3a8a" stroke-width="2"/>
<path d="M 1065 611 L 1065 660" fill="none" stroke="#1e3a8a" stroke-width="2"/>

<!-- Z3 CANONICAL ENVELOPE -->
<rect x="40" y="710" width="1320" height="24" fill="#1e3a8a" rx="4"/>
<text x="700" y="727" class="zh">ZONE 3 — CANONICAL ENVELOPE (all adapters output this identical JSON object)</text>

<rect x="40" y="746" width="1320" height="170" fill="#eff6ff" stroke="#2563eb" stroke-width="2" rx="8"/>
<text x="700" y="770" class="bts">Every adapter emits this envelope — transformation engine only reads this format</text>
<rect x="60" y="782" width="620" height="110" fill="#1e3a8a" rx="6"/>
<text x="80" y="806" class="ck">{ "pipeline_id": <tspan class="cv">"orders_v1"</tspan>,</text>
<text x="80" y="826" class="ck">  "source_type": <tspan class="cv">"event_hubs"</tspan>,   "schema_version": <tspan class="cv">"2.1"</tspan>,</text>
<text x="80" y="846" class="ck">  "ingestion_ts": <tspan class="cv">"2024-01-15T10:30:00Z"</tspan>,</text>
<text x="80" y="866" class="ck">  "confidence": <tspan class="cv">1.0</tspan>,   "errors": <tspan class="cv">[]</tspan> }</text>
<rect x="700" y="782" width="640" height="110" fill="#1e3a8a" rx="6"/>
<text x="720" y="806" class="ck">  "payload": {</text>
<text x="720" y="826" class="ck">    "order_id": <tspan class="cv">"A123"</tspan>, "customer_id": <tspan class="cv">"C99"</tspan>,</text>
<text x="720" y="846" class="ck">    "items": <tspan class="cv">[{"sku":"X1","qty":2},{"sku":"X2","qty":1}]</tspan>,</text>
<text x="720" y="866" class="ck">    "ts": <tspan class="cv">1705312200000</tspan>, "status": <tspan class="cv">"ACTIVE"</tspan> }</text>
<text x="700" y="900" class="bts" style="font-size:12px">CSV row · API JSON · Kafka event · CDC record → all become this before transformation runs</text>

<path d="M 700 916 L 700 956" fill="none" stroke="#0d9488" stroke-width="2" marker-end="url(#at)"/>

<!-- Z4 TRANSFORM ENGINE -->
<rect x="40" y="966" width="1320" height="24" fill="#0f766e" rx="4"/>
<text x="700" y="983" class="zh">ZONE 4 — TRANSFORMATION ENGINE (executes Phase 1 generated PySpark/SQL · no AI inference)</text>

<rect x="40" y="1000" width="420" height="165" fill="#f0fdfa" stroke="#0f766e" stroke-width="2" rx="6"/>
<text x="250" y="1024" class="bt">Streaming — Databricks</text>
<text x="250" y="1042" class="bs">Structured Streaming core engine</text>
<text x="250" y="1060" class="bs">Stateful Pandas UDFs applied</text>
<text x="250" y="1078" class="bs">Checkpoints → ADLS Gen 2</text>
<text x="250" y="1096" class="bs">watermark: 10min event-time lag</text>
<rect x="52" y="1110" width="396" height="18" fill="#115e59" rx="4"/>
<text x="250" y="1123" class="tt">pyspark · Azure Databricks ML · Delta Lake</text>
<rect x="52" y="1134" width="396" height="18" fill="#064e3b" rx="4"/>
<text x="250" y="1147" class="tt">df.withColumn("item", explode(col("items")))</text>

<rect x="475" y="1000" width="420" height="165" fill="#f0fdfa" stroke="#0f766e" stroke-width="2" rx="6"/>
<text x="685" y="1024" class="bt">Batch — ADF / Synapse</text>
<text x="685" y="1042" class="bs">ADF Pipeline scheduled trigger</text>
<text x="685" y="1060" class="bs">Python rules on ephemeral Spark pool</text>
<text x="685" y="1078" class="bs">Synapse SQL for in-warehouse joins</text>
<text x="685" y="1096" class="bs">WRITE_TRUNCATE / APPEND mode</text>
<rect x="487" y="1110" width="396" height="18" fill="#115e59" rx="4"/>
<text x="685" y="1123" class="tt">pyspark · ADF · Azure Synapse Analytics</text>
<rect x="487" y="1134" width="396" height="18" fill="#064e3b" rx="4"/>
<text x="685" y="1147" class="tt">F.to_utc_timestamp(F.col("ts")/1000)</text>

<rect x="910" y="1000" width="450" height="165" fill="#f0fdfa" stroke="#0f766e" stroke-width="2" rx="6"/>
<text x="1135" y="1024" class="bt">SQL-Only — Synapse Serverless</text>
<text x="1135" y="1042" class="bs">no cluster required · on-demand</text>
<text x="1135" y="1060" class="bs">T-SQL only transformation logic</text>
<text x="1135" y="1078" class="bs">external table over ADLS parquet</text>
<text x="1135" y="1096" class="bs">CTAS → new partitioned output</text>
<rect x="922" y="1110" width="426" height="18" fill="#115e59" rx="4"/>
<text x="1135" y="1123" class="tt">Synapse SQL Serverless Pool</text>
<rect x="922" y="1134" width="426" height="18" fill="#064e3b" rx="4"/>
<text x="1135" y="1147" class="tt">df.filter(col("status") != "CANCELLED")</text>

<path d="M 700 1165 L 700 1205" fill="none" stroke="#0d9488" stroke-width="2" marker-end="url(#at)"/>

<!-- Z5 JSON OUTPUT -->
<rect x="40" y="1215" width="1320" height="24" fill="#0f766e" rx="4"/>
<text x="700" y="1232" class="zh">ZONE 5 — JSON OUTPUT CONSOLIDATION (primary canonical format for all consumers)</text>

<rect x="40" y="1250" width="420" height="120" fill="#f0fdfa" stroke="#0f766e" stroke-width="2" rx="6"/>
<text x="250" y="1274" class="bt">JSON Serialization</text>
<text x="250" y="1294" class="bs">All transformation output → JSON first</text>
<text x="250" y="1312" class="bs">RFC 8259 compliant · UTF-8 encoded</text>
<text x="250" y="1332" class="bs">envelope wrapper preserved</text>
<rect x="52" y="1344" width="396" height="18" fill="#115e59" rx="4"/><text x="250" y="1357" class="tt">orjson · ujson · pyspark df.toJSON()</text>

<rect x="475" y="1250" width="420" height="120" fill="#f0fdfa" stroke="#0f766e" stroke-width="2" rx="6"/>
<text x="685" y="1274" class="bt">Schema Validation Gate</text>
<text x="685" y="1294" class="bs">output JSON vs target schema</text>
<text x="685" y="1312" class="bs">row counts vs source ±5%</text>
<text x="685" y="1332" class="bs">DLQ backlog → Azure Monitor alert</text>
<rect x="487" y="1344" width="396" height="18" fill="#115e59" rx="4"/><text x="685" y="1357" class="tt">jsonschema · Great Expectations · azure-monitor</text>

<rect x="910" y="1250" width="450" height="120" fill="#f0fdfa" stroke="#0f766e" stroke-width="2" rx="6"/>
<text x="1135" y="1274" class="bt">Observability &amp; Lineage</text>
<text x="1135" y="1294" class="bs">pipeline_complete event → Service Bus</text>
<text x="1135" y="1312" class="bs">Purview: source → transform → sink</text>
<text x="1135" y="1332" class="bs">Azure Monitor: lag · DLQ · job failure</text>
<rect x="922" y="1344" width="426" height="18" fill="#115e59" rx="4"/><text x="1135" y="1357" class="tt">azure-servicebus · Microsoft Purview SDK</text>

<!-- output example -->
<rect x="40" y="1382" width="1320" height="48" fill="#064e3b" rx="6"/>
<text x="55" y="1402" class="cm" style="fill:#a7f3d0;font-style:italic">Canonical JSON output (2 rows exploded from 1 Kafka message):</text>
<text x="55" y="1421" class="cd">{"order_id":"A123","sku":"X1","qty":2,"ts":"2024-01-15T10:30:00Z","status":"ACTIVE"} · {"order_id":"A123","sku":"X2","qty":1,...}</text>

<path d="M 700 1430 L 700 1468" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#ag)"/>

<!-- Z6 MULTI-FORMAT REGEN -->
<rect x="40" y="1478" width="1320" height="24" fill="#047857" rx="4"/>
<text x="700" y="1495" class="zh">ZONE 6 — MULTI-FORMAT REGENERATION (JSON → consumer-specific format · no re-processing)</text>

<rect x="40" y="1514" width="248" height="130" fill="#f0fdfa" stroke="#0f766e" stroke-width="2" rx="6"/>
<text x="164" y="1536" class="bt">Relational DB</text>
<text x="164" y="1554" class="bs">JSON rows → SQL INSERT</text>
<text x="164" y="1572" class="bs">upsert via primary key merge</text>
<text x="164" y="1590" class="bs">Azure SQL / Synapse DW</text>
<rect x="52" y="1604" width="224" height="18" fill="#115e59" rx="4"/><text x="164" y="1617" class="tt">SQLAlchemy · pyodbc</text>

<rect x="302" y="1514" width="248" height="130" fill="#f0fdfa" stroke="#0f766e" stroke-width="2" rx="6"/>
<text x="426" y="1536" class="bt">Kafka / Event Hubs</text>
<text x="426" y="1554" class="bs">JSON → message bus publish</text>
<text x="426" y="1572" class="bs">downstream streaming consumers</text>
<text x="426" y="1590" class="bs">topic: orders_clean_v1</text>
<rect x="314" y="1604" width="224" height="18" fill="#115e59" rx="4"/><text x="426" y="1617" class="tt">confluent-kafka-python</text>

<rect x="564" y="1514" width="248" height="130" fill="#f0fdfa" stroke="#0f766e" stroke-width="2" rx="6"/>
<text x="688" y="1536" class="bt">Parquet / ADLS Lake</text>
<text x="688" y="1554" class="bs">JSON → columnar Parquet</text>
<text x="688" y="1572" class="bs">partitioned by date/region</text>
<text x="688" y="1590" class="bs">ADLS Gen 2 prefix structure</text>
<rect x="576" y="1604" width="224" height="18" fill="#115e59" rx="4"/><text x="688" y="1617" class="tt">pyarrow · delta-rs</text>

<rect x="826" y="1514" width="248" height="130" fill="#f0fdfa" stroke="#0f766e" stroke-width="2" rx="6"/>
<text x="950" y="1536" class="bt">NoSQL / Search</text>
<text x="950" y="1554" class="bs">native JSON → direct push</text>
<text x="950" y="1572" class="bs">Cosmos DB / Elastic index</text>
<text x="950" y="1590" class="bs">full-text search enabled</text>
<rect x="838" y="1604" width="224" height="18" fill="#115e59" rx="4"/><text x="950" y="1617" class="tt">azure-cosmos · elasticsearch-py</text>

<rect x="1088" y="1514" width="272" height="130" fill="#f0fdfa" stroke="#0f766e" stroke-width="2" rx="6"/>
<text x="1224" y="1536" class="bt">REST API / Webhook</text>
<text x="1224" y="1554" class="bs">JSON POST to downstream</text>
<text x="1224" y="1572" class="bs">retry + exponential backoff</text>
<text x="1224" y="1590" class="bs">HMAC signature on payload</text>
<rect x="1100" y="1604" width="248" height="18" fill="#115e59" rx="4"/><text x="1224" y="1617" class="tt">httpx · tenacity · azure-apim</text>

<!-- FOOTER -->
<rect x="40" y="1662" width="640" height="90" fill="#fef2f2" stroke="#ef4444" stroke-width="2" rx="8"/>
<text x="360" y="1684" class="tx" style="font-weight:bold;fill:#b91c1c">Phase 2 AI usage — minimal and targeted only</text>
<text x="360" y="1704" class="tx" style="fill:#991b1b">Codex: semantic field mapping in API adapter (ambiguous schemas)</text>
<text x="360" y="1722" class="tx" style="fill:#991b1b">Document Analyzer: unstructured docs arriving at Blob adapter</text>
<text x="360" y="1742" class="tx" style="fill:#991b1b">No GPT-4 · No manifest inference · No code generation in runtime</text>

<rect x="700" y="1662" width="660" height="90" fill="#ecfdf5" stroke="#059669" stroke-width="2" rx="8"/>
<text x="1030" y="1684" class="tx" style="font-weight:bold;fill:#047857">JSON-first architecture benefit</text>
<text x="1030" y="1704" class="tx" style="fill:#065f46">Master JSON stored once → regenerated to any sink on-demand</text>
<text x="1030" y="1722" class="tx" style="fill:#065f46">No re-processing needed when new sink type added</text>
<text x="1030" y="1742" class="tx" style="fill:#065f46">Zone 6 converters are thin adapters, not transformation logic</text>
</svg>
