.bt{font:bold 15px system-ui;fill:#0f766e;text-anchor:middle}
.bts{font:bold 15px system-ui;fill:#1e3a8a;text-anchor:middle}
.bs{font:12px system-ui;fill:#115e59;text-anchor:middle}
.tx{font:12px system-ui;fill:#334155;text-anchor:middle}
.tl{font:11px system-ui;fill:#e2e8f0;text-anchor:middle}
.cd{font:12px ui-monospace;fill:#34d399}
.cm{font:11px ui-monospace;fill:#94a3b8}
.ck{font:12px ui-monospace;fill:#93c5fd}
.cv{font:12px ui-monospace;fill:#eff6ff}
.tt{font:12px ui-monospace;fill:#ccfbf1;text-anchor:middle}
</style>
<marker id="at" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#0d9488"/></marker>
<marker id="ab" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#1e3a8a"/></marker>
<marker id="ag" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#059669"/></marker>
</defs>
<rect width="1400" height="1900" fill="#f8fafc"/>

<!-- HEADER -->
<rect x="40" y="15" width="1320" height="65" fill="#134e4a" rx="8"/>
<text x="700" y="42" class="ttl">AIGEN Phase 2 — Run Time · Low-Level Architecture</text>
<text x="700" y="63" class="sub">Executes Phase 1 code · Codex for semantic mapping · Document Analyzer for unstructured docs · JSON as master output</text>

<!-- Z1 REAL DATA -->
<rect x="40" y="95" width="1320" height="24" fill="#0f766e" rx="4"/>
<text x="700" y="112" class="zh">ZONE 1 — REAL DATA SOURCES (adapters deployed by Phase 1 CI/CD)</text>

<rect x="40" y="130" width="240" height="150" fill="#f0fdfa" stroke="#0f766e" stroke-width="2" rx="6"/>
<text x="160" y="155" class="bt">Event Hubs</text>
<text x="160" y="172" class="bs">Kafka-compatible stream</text>
<text x="160" y="192" class="bs">JSON / Avro events</text>
<text x="160" y="212" class="bs">offset: earliest/latest</text>
<rect x="52" y="225" width="216" height="18" fill="#115e59" rx="4"/>
<text x="160" y="238" class="tt">confluent-kafka-python</text>
<text x="160" y="258" class="bs">fastavro · Apicurio registry</text>

<rect x="295" y="130" width="240" height="150" fill="#f0fdfa" stroke="#0f766e" stroke-width="2" rx="6"/>
<text x="415" y="155" class="bt">Blob Storage</text>
<text x="415" y="172" class="bs">batch file drops</text>
<text x="415" y="192" class="bs">CSV · Parquet · Avro</text>
<text x="415" y="212" class="bs">Event Grid trigger</text>
<rect x="307" y="225" width="216" height="18" fill="#115e59" rx="4"/>
<text x="415" y="238" class="tt">pandas · pyarrow · polars</text>
<text x="415" y="258" class="bs">Document Analyzer: PDF/Word docs</text>

<rect x="550" y="130" width="240" height="150" fill="#f0fdfa" stroke="#0f766e" stroke-width="2" rx="6"/>
<text x="670" y="155" class="bt">REST API / Webhooks</text>
<text x="670" y="172" class="bs">Azure APIM gateway</text>
<text x="670" y="192" class="bs">Azure Functions poller</text>
<text x="670" y="212" class="bs">pagination + OAuth handled</text>
<rect x="562" y="225" width="216" height="18" fill="#115e59" rx="4"/>
<text x="670" y="238" class="tt">httpx · requests · Azure SDK</text>

<rect x="805" y="130" width="240" height="150" fill="#f0fdfa" stroke="#0f766e" stroke-width="2" rx="6"/>
<text x="925" y="155" class="bt">Azure SQL / CDC</text>
<text x="925" y="172" class="bs">row-level change capture</text>
<text x="925" y="192" class="bs">Debezium → Service Bus</text>
<text x="925" y="212" class="bs">op: insert / update / delete</text>
<rect x="817" y="225" width="216" height="18" fill="#115e59" rx="4"/>
<text x="925" y="238" class="tt">Debezium · azure-servicebus</text>

<rect x="1060" y="130" width="300" height="150" fill="#fef2f2" stroke="#ef4444" stroke-width="2" rx="6"/>
<text x="1210" y="155" class="bt" style="fill:#b91c1c">DLQ (per source)</text>
<text x="1210" y="172" class="bs" style="fill:#991b1b">schema mismatch → dead-letter</text>
<text x="1210" y="192" class="bs" style="fill:#991b1b">parse failure → error envelope</text>
<text x="1210" y="212" class="bs" style="fill:#991b1b">replay via Service Bus DLQ</text>
<rect x="1072" y="225" width="276" height="18" fill="#7f1d1d" rx="4"/>
<text x="1210" y="238" class="tt">Service Bus dead-letter queue</text>

<!-- raw message example -->
<rect x="40" y="293" width="1320" height="48" fill="#064e3b" rx="6"/>
<text x="55" y="313" class="cm" style="fill:#a7f3d0;font-style:italic">Raw Kafka message (before adapter):</text>
<text x="55" y="332" class="cd">{"id":"A123","customer_id":"C99","items":[{"sku":"X1","qty":2},{"sku":"X2","qty":1}],"ts":"1705312200000","status":"ACTIVE"}</text>

