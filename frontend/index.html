    <style>
      /* Critical path CSS for instant theme rendering & FCP optimization */
      html, body {
        background-color: #030705;
        color: #f5f5f7;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      }
      #root {
        min-height: 100vh;
      }
      .app-shell-loading {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #030705;
      }
      .app-shell-spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(0, 176, 116, 0.15);
        border-top-color: #00b074;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .app-shell-text {
        color: rgba(245, 245, 247, 0.5);
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        animation: pulse 1.5s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
    </style>
