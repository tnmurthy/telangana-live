<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Telangana Live - Civic Intelligence Portal</title>

    <!-- Preconnect and DNS-prefetch resource hints for third-party ad networks -->
    <link rel="preconnect" href="https://pagead2.googlesyndication.com" crossorigin />
    <link rel="dns-prefetch" href="https://pagead2.googlesyndication.com" />
    <link rel="preconnect" href="https://googleads.g.doubleclick.net" crossorigin />
    <link rel="dns-prefetch" href="https://googleads.g.doubleclick.net" />
    
    <style>
      /* Critical path CSS for instant theme rendering & FCP optimization */
      html, body {
        background-color: #030705;
        color: #f5f5f7;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      }
      #root {
        min-height: 100vh;
      }
      .app-shell-loading {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #030705;
      }
      .app-shell-spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(0, 176, 116, 0.15);
        border-top-color: #00b074;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .app-shell-text {
        color: rgba(245, 245, 247, 0.5);
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        animation: pulse 1.5s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Instant dark Obsidian shell with spinner during React boot -->
      <div class="app-shell-loading">
        <div class="app-shell-spinner"></div>
        <p class="app-shell-text">Calibrating 2026 Data...</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
