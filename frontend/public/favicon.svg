<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gold Gradient for the Arch -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Glowing Kakatiya Kala Thoranam (Warangal Arch) in Gold -->
  <g filter="url(#glow)" fill="none" stroke="url(#goldGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Pillars -->
    <path d="M 160 440 V 220" />
    <path d="M 352 440 V 220" />
    <!-- Sweeping Arch Bar -->
    <path d="M 100 220 H 412" stroke-width="32" />
    <!-- Secondary Arch Structure -->
    <path d="M 120 160 H 392" stroke-width="20" />
    <!-- Top Ornamental Sweeps -->
    <path d="M 160 160 Q 256 80 352 160" />
    <path d="M 210 220 Q 256 180 302 220" />
  </g>
</svg>