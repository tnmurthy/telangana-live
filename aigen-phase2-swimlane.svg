<text x="190" y="1065" class="node-sub" fill="#991b1b" font-weight="bold" text-anchor="middle">Phase 2 Runtime uses NO</text>
<text x="190" y="1085" class="node-sub" fill="#991b1b" font-weight="bold" text-anchor="middle">Generative AI or context.</text>
<text x="190" y="1105" class="node-sub" fill="#991b1b" font-weight="bold" text-anchor="middle">It just runs Phase 1 logic.</text>

