<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1280" width="1400" height="1280">
<defs>
    <style>
        .page-title { font-family: system-ui, -apple-system, sans-serif; font-size: 26px; font-weight: bold; fill: #1e293b; }
        .page-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; fill: #475569; }
        .lane-header { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: bold; fill: #ffffff; }
        .node-title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: bold; }
        .node-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-style: italic; }
        .node-code { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 13px; font-weight: 600; }
    </style>
    <!-- Markers -->
    <marker id="arr-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/></marker>
    <marker id="arr-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#0284c7"/></marker>
    <marker id="arr-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#7e22ce"/></marker>
    <marker id="arr-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#059669"/></marker>
</defs>

<!-- Main Canvas Background -->
<rect width="1400" height="1280" fill="#ffffff"/>

<!-- Header Titles -->
<text x="700" y="60" class="page-title" text-anchor="middle">AIGEN Phase 2 — Runtime Swimlane Architecture</text>
<text x="700" y="90" class="page-sub" text-anchor="middle">Executes Phase 1 generated code · No AI active · Triggered by data · Outputs Canonical Format</text>

<!-- SWIMLANE BOUNDARIES -->
<!-- Lane 1: Data Ingestion -->
<rect x="40" y="140" width="300" height="1100" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" rx="8"/>
<rect x="55" y="160" width="270" height="40" rx="8" fill="#0f172a"/>
<text x="190" y="186" class="lane-header" text-anchor="middle">1: Data Ingestion</text>

<!-- Lane 2: Federated Adapters -->
<rect x="380" y="140" width="300" height="1100" fill="#f0f9ff" stroke="#bae6fd" stroke-width="2" rx="8"/>
<rect x="395" y="160" width="270" height="40" rx="8" fill="#0369a1"/>
<text x="530" y="186" class="lane-header" text-anchor="middle">2: Federated Adapters</text>

<!-- Lane 3: Transformation Engine -->
<rect x="720" y="140" width="300" height="1100" fill="#faf5ff" stroke="#e9d5ff" stroke-width="2" rx="8"/>
<rect x="735" y="160" width="270" height="40" rx="8" fill="#7e22ce"/>
