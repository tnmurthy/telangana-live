<text x="190" y="740" class="node-code" fill="#475569" text-anchor="middle">insert / update / delete</text>
<text x="190" y="758" class="node-code" fill="#475569" text-anchor="middle">Push notification</text>

<rect x="55" y="1000" width="270" height="140" fill="#fef2f2" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,4" rx="8"/>
