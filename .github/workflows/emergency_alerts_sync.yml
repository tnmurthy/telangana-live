name: Real-time Emergency Alerts Sync

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: emergency-alerts-sync
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync-alerts:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Sync civic alerts (Google News RSS + TypeSafe triage)
        env:
          # Without this the triage falls back to the old regex matcher and
          # labels every verdict source="regex".
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: python backend/scripts/emergency_alerts.py

      - name: Commit and push updated alerts
        id: commit
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add frontend/public/data/alerts.json frontend/src/data/alerts.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: sync real-time emergency alerts [automated] [skip ci]"
            git pull --rebase origin main || (git rebase --abort && exit 0)
            if git push origin main; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::Push skipped due to concurrent commit."
            fi
          else
            echo "No changes to commit"
          fi
