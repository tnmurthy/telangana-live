name: Real-time Emergency Alerts Sync

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: emergency-alerts-sync
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync-alerts:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Sync emergency alerts (AI + News + Fallback)
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          Z_AI_API_KEY: ${{ secrets.Z_AI_API_KEY }}
        run: python backend/scripts/emergency_alerts.py

      - name: Commit and push updated alerts
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add frontend/public/data/alerts.json frontend/src/data/alerts.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: sync real-time emergency alerts [automated] [skip ci]"
            git pull --rebase origin main || (git rebase --abort && exit 0)
            git push origin main || echo "::warning::Push skipped due to concurrent commit."
          else
            echo "No changes to commit"
          fi

