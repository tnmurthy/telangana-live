name: Real-time Emergency Alerts Sync

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: emergency-alerts-sync
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync-alerts:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Sync civic alerts (Google News RSS + TypeSafe triage)
        env:
          # Without this the triage falls back to the old regex matcher and
          # labels every verdict source="regex".
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: python backend/scripts/emergency_alerts.py

      - name: Commit and push updated alerts
        id: commit
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add frontend/public/data/alerts.json frontend/src/data/alerts.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: sync real-time emergency alerts [automated] [skip ci]"
            git pull --rebase origin main || (git rebase --abort && exit 0)
            if git push origin main; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::Push skipped due to concurrent commit."
            fi
          else
            echo "No changes to commit"
          fi

      # Data commits carry [skip ci], so no workflow is triggered by the push and
      # the site is never rebuilt. Poke the Vercel deploy hook directly instead.
      - name: Trigger Vercel deploy
        # Only when this run actually pushed a commit; otherwise there is
        # nothing new to build (was firing ~96+ times a day for no change).
        if: steps.commit.outputs.pushed == 'true'
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK_URL not set - site will not rebuild."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$VERCEL_DEPLOY_HOOK_URL")
          echo "Deploy hook responded $code"
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ] || echo "::warning::Deploy hook returned $code"
