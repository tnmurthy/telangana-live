name: Node.js Build (Vite)

on:
  push:
    branches: [ "master", "dev" ]
    paths: [ 'frontend/**' ]
  pull_request:
    branches: [ "master" ]
    paths: [ 'frontend/**' ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Install
        run: npm install
      - name: Build with Vite
        run: npm run build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: vite-dist
          path: frontend/dist/
          retention-days: 7