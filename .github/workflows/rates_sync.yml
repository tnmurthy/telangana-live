name: Sync Market Rates

# Runs every 12 hours: 1:00 AM UTC (6:30 AM IST) and 1:00 PM UTC (6:30 PM IST)
# Can also be triggered manually from the Actions tab.
on:
  schedule:
    - cron: '0 1,13 * * *'
  workflow_dispatch:

concurrency:
  group: sync-market-rates
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # required to commit data files back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Sync fuel and pulses
        run: python backend/scripts/data_engine.py --finance-only

      - name: Commit and push updated rate files
        id: commit
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add frontend/src/data/fuelPrices.js frontend/src/data/pulses.js
          if ! git diff --staged --quiet; then
            git commit -m "chore: sync market rates (fuel, pulses) [automated] [skip ci]"
            git pull --rebase origin main || (git rebase --abort && exit 0)
            if git push origin main; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::Push skipped due to concurrent commit."
            fi
          else
            echo "No changes to commit"
          fi
