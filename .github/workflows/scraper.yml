name: Automate Civic Data Engine

on:
  schedule:
    # Run every 4 hours at minute 15
    - cron: '15 */4 * * *'
  workflow_dispatch:

concurrency:
  group: automate-civic-data-engine
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Data Engine
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          cd backend
          python scripts/data_engine.py --task gold
          python scripts/data_engine.py --task fuel
          python scripts/data_engine.py --task pulses

      - name: Commit and Push changes
        run: |
          git config --global user.name "Data Engine Bot"
          git config --global user.email "bot@telangana.live"
          git add frontend/src/data/goldRates.js frontend/src/data/fuelPrices.js frontend/src/data/pulses.js
          if ! git diff --staged --quiet; then
            git commit -m "chore: Auto-update civic data [skip ci]"
            git pull --rebase origin main || (git rebase --abort && exit 0)
            git push origin main || echo "::warning::Push skipped due to concurrent commit."
          else
            echo "No changes to commit"
          fi

