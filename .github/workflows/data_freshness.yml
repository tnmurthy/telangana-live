# Daily data-freshness check (backend/scripts/check_freshness.py).
# Fails when any published module is older than its limit, so GitHub emails
# the maintainer; the run summary shows a table of every module's age.
name: Data Freshness Check

on:
  schedule:
    - cron: "30 2 * * *" # 08:00 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check every data module's age
        run: python backend/scripts/check_freshness.py
