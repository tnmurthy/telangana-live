name: "Unified Enterprise CI/CD Pipeline"

on:
  push:
    branches: [ "main", "staging" ]
  pull_request:
    branches: [ "main", "staging" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-compliance:
    name: "Security & Compliance Scans"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Secret Scanning
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Python Dependency Audit (Safety)
        run: |
          pip install safety
          safety check -r backend/requirements.txt || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          
      - name: Frontend Dependency Audit (npm audit)
        run: |
          cd frontend
          npm audit --audit-level=high || true

  frontend-ci:
    name: "Frontend: Lint, Build, Test"
    runs-on: ubuntu-latest
    needs: [security-and-compliance]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install Dependencies
        run: npm ci || npm install
        
      - name: Lint Code
        run: npm run lint
        
      - name: Type Check
        run: npm run typecheck
        
      - name: Unit Tests
        run: npm run test
        
      - name: Production Build
        run: npm run build
        
      - name: Bundle Size Budget Check
        run: |
          if [ -f .size-limit.json ]; then
            npx size-limit
          else
            echo "Skipping size limit, config not found."
          fi

  backend-ci:
    name: "Backend: Lint, Test, Coverage"
    runs-on: ubuntu-latest
    needs: [security-and-compliance]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install ruff bandit pytest pytest-cov
          
      - name: SAST via Bandit
        run: bandit -r . -ll -ii -x ./tests
        
      - name: Lint via Ruff
        run: ruff check .
        
      - name: Run Tests with Coverage
        run: pytest --cov=. --cov-report=xml
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  e2e-testing:
    name: "End-to-End E2E Testing"
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        run: |
          cd frontend
          npm ci
          npx playwright install --with-deps
      - name: Run Playwright Tests
        run: |
          cd frontend
          npm run test:e2e

  deploy-staging:
    name: "Deploy to Staging"
    runs-on: ubuntu-latest
    needs: [e2e-testing]
    if: github.ref == 'refs/heads/staging' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Vercel Deploy (Staging)
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vercel-args: "--yes"

  deploy-production:
    name: "Deploy to Production"
    runs-on: ubuntu-latest
    needs: [e2e-testing]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
      - name: Vercel Deploy (Production)
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vercel-args: "--prod --yes"
