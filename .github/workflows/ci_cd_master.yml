name: "Unified Enterprise CI/CD Pipeline"

on:
  push:
    branches: [ "main", "staging" ]
  pull_request:
    branches: [ "main", "staging" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-compliance:
    name: "Security & Compliance Scans"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Diff scanning needs both ends of the range; the default shallow
          # clone only has the tip.
          fetch-depth: 0

      # Resolve the commit range to scan. The previous config passed
      # base=<default branch>, head=HEAD, which on a push to main resolves to
      # the same commit — TruffleHog then exits 1 with "BASE and HEAD commits
      # are the same", failing this job and skipping every downstream job,
      # including Deploy to Production.
      - name: Resolve scan range
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          # All-zero SHA means a new branch or a force push with no prior tip.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "No usable base commit; scanning the working tree instead."
            echo "mode=filesystem" >> "$GITHUB_OUTPUT"
          elif [ "$base" = "${{ github.sha }}" ]; then
            echo "Base equals head; scanning the working tree instead."
            echo "mode=filesystem" >> "$GITHUB_OUTPUT"
          else
            echo "mode=git" >> "$GITHUB_OUTPUT"
            echo "base=$base" >> "$GITHUB_OUTPUT"
          fi

      - name: Secret Scanning (commit range)
        if: steps.range.outputs.mode == 'git'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ steps.range.outputs.base }}
          head: ${{ github.sha }}
          extra_args: --only-verified

      - name: Secret Scanning (working tree)
        if: steps.range.outputs.mode == 'filesystem'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified --no-verification-cache

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Python Dependency Audit (Safety)
        run: |
          pip install safety
          safety check -r backend/requirements.txt || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          
      - name: Frontend Dependency Audit (npm audit)
        run: |
          cd frontend
          npm audit --audit-level=high || true

  frontend-ci:
    name: "Frontend: Lint, Build, Test"
    runs-on: ubuntu-latest
    needs: [security-and-compliance]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install Dependencies
        run: npm ci || npm install
        
      - name: Lint Code
        run: npm run lint
        
      - name: Type Check
        run: npm run typecheck
        
      - name: Unit Tests
        run: npm run test
        
      - name: Production Build
        run: npm run build
        
      - name: Bundle Size Budget Check
        run: |
          if [ -f .size-limit.json ]; then
            npx size-limit
          else
            echo "Skipping size limit, config not found."
          fi

  backend-ci:
    name: "Backend: Lint, Test, Coverage"
    runs-on: ubuntu-latest
    needs: [security-and-compliance]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install ruff bandit pytest pytest-cov
          
      - name: SAST via Bandit
        run: bandit -r . -ll -ii -x ./tests
        
      - name: Lint via Ruff
        run: ruff check .
        
      - name: Run Tests with Coverage
        run: pytest --cov=. --cov-report=xml
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  e2e-testing:
    name: "End-to-End E2E Testing"
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        run: |
          cd frontend
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Playwright Tests
        run: |
          cd frontend
          npm run test:e2e

  # No deploy jobs here: Vercel's Git integration deploys main to production
  # on every push. The Vercel-CLI jobs that were here would have made a second
  # production deploy (and never ran: no VERCEL_TOKEN secret, E2E never passed).
