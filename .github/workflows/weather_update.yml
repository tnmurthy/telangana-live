name: Hourly Weather Update

on:
  schedule:
    - cron: '30 * * * *'
  workflow_dispatch:

concurrency:
  group: hourly-weather-update
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Weather Scraper (OWM + Open-Meteo Fallback)
        env:
          OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
        run: python backend/scripts/weather_scraper.py

      - name: Commit and Push Updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add frontend/src/data/weatherData.js
          if ! git diff --staged --quiet; then
            git commit -m "chore: update weather data [automated] [skip ci]"
            git pull --rebase origin main || (git rebase --abort && exit 0)
            git push origin main || echo "::warning::Push skipped due to concurrent commit."
          else
            echo "No changes to commit"
          fi

