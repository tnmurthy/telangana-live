name: Gold & Silver Update (12-hour)

on:
  schedule:
    - cron: '45 */12 * * *'
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-gold-silver:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Sync Gold & Silver Prices
        run: python backend/scripts/data_engine.py --task gold

      - name: Commit and Push Updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add frontend/src/data/goldRates.js
          git commit -m "chore: update gold and silver rates [automated]" || echo "No changes to commit"
          git pull --rebase origin main
          git push
