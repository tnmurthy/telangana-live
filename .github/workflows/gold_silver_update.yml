name: Gold & Silver Update (12-hour)

on:
  schedule:
    - cron: '45 */12 * * *'
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-gold-silver:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4

      - name: Sync Gold & Silver Prices
        run: python scripts/data_engine.py --task gold

      - name: Commit and Push Updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add src/data/fuelPrices.js src/data/pulses.js src/data/aiBriefingData.js
          git commit -m "chore: update fuel, commodity, and AI pulse data [automated]" || echo "No changes to commit"
          git pull --rebase origin master
          git push