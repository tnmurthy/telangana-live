name: Mandi Prices (Agmarknet)

# Telangana wholesale prices and MSPs from api.agmarknet.gov.in (no key).
# 08:30 and 18:30 IST: markets report through the day, so the evening run
# picks up most of that day's arrivals.
on:
  schedule:
    - cron: '0 3,13 * * *'
  workflow_dispatch:

concurrency:
  group: mandi-sync-master
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch mandi prices
        run: python backend/scripts/mandi_sync.py

      - name: Commit and push the snapshot
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add frontend/src/data/mandiPrices.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: sync mandi prices [automated] [skip ci]"
            git pull --rebase origin main || (git rebase --abort && exit 0)
            git push origin main || echo "::warning::Push skipped due to concurrent commit."
          else
            echo "No changes to commit"
          fi
