name: Tech & AI Pulse Update

on:
  schedule:
    - cron: '30 0,6,12 * * *' # 6:00 AM, 12:00 PM, 6:00 PM IST
  workflow_dispatch:

concurrency:
  group: daily-ai-pulse-update
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-ai-pulse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      # Sourced, dated local tech news (backend/scripts/tech_pulse.py, shared
      # with vizag.live). Without TYPESAFE_API_KEY it falls back to keyword
      # matching, and each item records which method admitted it.
      - name: Sync Tech & AI Pulse
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: python backend/scripts/tech_pulse.py --region telangana

      - name: Commit and Push Updates
        id: commit
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add frontend/public/data/tech_pulse.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update tech pulse feed [automated] [skip ci]"
            git pull --rebase origin main || (git rebase --abort && exit 0)
            if git push origin main; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::Push skipped due to concurrent commit."
            fi
          else
            echo "No changes to commit"
          fi
