name: Secondary Prices Update (6-hour)

on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:

concurrency:
  group: secondary-prices-update
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-secondary-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Sync Fuel Prices
        run: python backend/scripts/data_engine.py --task fuel

      - name: Sync Commodity (Pulses) Prices
        run: python backend/scripts/data_engine.py --task pulses

      - name: Commit and Push Updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add frontend/src/data/fuelPrices.js frontend/src/data/pulses.js
          if ! git diff --staged --quiet; then
            git commit -m "chore: update fuel and commodity data [automated] [skip ci]"
            git pull --rebase origin main || (git rebase --abort && exit 0)
            git push origin main || echo "::warning::Push skipped due to concurrent commit."
          else
            echo "No changes to commit"
          fi

